<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kimi Chat — a fast, accessible AI chat interface" />
  <title>Kimi Chat</title>

  <!-- Preconnect to CDNs for faster resource loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <!-- Marked (Markdown parser) -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"
    crossorigin="anonymous"
    defer
  ></script>

  <!-- DOMPurify (sanitize HTML before insertion) -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"
    crossorigin="anonymous"
    defer
  ></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Skip-to-content link for keyboard users -->
  <a class="skip-link" href="#chat-messages">Skip to messages</a>

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside
    id="sidebar"
    class="sidebar"
    aria-label="Chat history"
    aria-expanded="false"
  >
    <header class="sidebar__header">
      <h1 class="sidebar__logo">
        <span aria-hidden="true">✦</span> Kimi
      </h1>
      <button
        id="new-chat-btn"
        class="btn btn--icon btn--new-chat"
        aria-label="New chat"
        title="New chat"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <nav class="sidebar__nav" aria-label="Previous chats">
      <ul id="chat-list" class="chat-list" role="list">
        <!-- Chat history items injected here -->
      </ul>
    </nav>

    <footer class="sidebar__footer">
      <button
        id="theme-toggle"
        class="btn btn--ghost btn--full"
        aria-label="Toggle dark/light theme"
        aria-pressed="true"
      >
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span>Dark mode</span>
      </button>
    </footer>
  </aside>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- ── Main content ─────────────────────────────────────────── -->
  <div class="layout">
    <!-- Top bar -->
    <header class="topbar">
      <button
        id="sidebar-toggle"
        class="btn btn--icon"
        aria-label="Open sidebar"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="topbar__title" aria-live="polite" id="current-chat-title">Kimi Chat</span>

      <div class="topbar__actions">
        <button
          id="clear-chat-btn"
          class="btn btn--ghost"
          aria-label="Clear current conversation"
        >Clear</button>
      </div>
    </header>

    <!-- Message list -->
    <main class="main-content">
      <section
        id="chat-messages"
        class="messages"
        aria-label="Conversation"
        aria-live="polite"
        aria-atomic="false"
        tabindex="0"
      >
        <!-- Welcome state shown when there are no messages -->
        <div id="welcome" class="welcome" aria-label="Welcome screen">
          <div class="welcome__icon" aria-hidden="true">✦</div>
          <h2 class="welcome__title">How can I help you today?</h2>
          <p class="welcome__sub">Ask anything — Kimi is ready.</p>
        </div>
      </section>
    </main>

    <!-- Input area -->
    <footer class="input-area" role="form" aria-label="Send a message">
      <!-- File preview strip -->
      <div id="file-preview" class="file-preview" aria-live="polite" hidden></div>

      <div class="input-row">
        <!-- Attach file -->
        <label class="btn btn--icon" aria-label="Attach a file" title="Attach file">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.49"
              stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="file-input"
            type="file"
            class="visually-hidden"
            accept="image/*,.pdf,.txt,.md,.csv,.json"
            multiple
            aria-label="Attach files"
          />
        </label>

        <!-- Text input -->
        <textarea
          id="chat-input"
          class="chat-input"
          placeholder="Message Kimi…"
          rows="1"
          aria-label="Message input"
          aria-multiline="true"
          autocomplete="off"
          spellcheck="true"
          maxlength="32000"
        ></textarea>

        <!-- Send button -->
        <button
          id="send-btn"
          class="btn btn--primary btn--send"
          aria-label="Send message"
          disabled
        >
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="18" height="18">
            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"
              stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="visually-hidden">Send</span>
        </button>
      </div>

      <p class="input-hint">
        Kimi can make mistakes. Check important info.
      </p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
